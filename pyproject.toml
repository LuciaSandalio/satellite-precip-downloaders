[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-precip-downloaders"
version = "0.1.0"
description = "Download, spatially subset, validate, and catalogue satellite precipitation data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "earthaccess>=0.9",
  "geopandas>=0.14",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "s3fs>=2024.2",
  "shapely>=2.0",
  "xarray>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
zarr = ["zarr>=2.17"]

[project.scripts]
satprecip = "satprecip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["satprecip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

